<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" role="img" aria-label="Three phases. The agent writes only to the branch and the pipeline holds every credential." font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c8c86"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="15" font-weight="600" fill="#111">The agent writes only to the branch</text>

  <g>
    <rect x="24" y="44" width="12" height="12" rx="3" fill="#2f6fb0" fill-opacity="0.12" stroke="#2f6fb0" stroke-width="2"/>
    <text x="42" y="54" fill="#666">Agent: no credentials</text>
    <rect x="190" y="44" width="12" height="12" rx="3" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="208" y="54" fill="#666">Pipeline: holds every credential</text>
  </g>

  <g fill="none" stroke="#8c8c86" stroke-width="1.25">
    <path d="M248 146H264" marker-end="url(#gate-arrow)"/>
    <path d="M472 146H488" marker-end="url(#gate-arrow)"/>
    <path d="M248 286H264" marker-end="url(#gate-arrow)"/>
    <path d="M472 286H488" marker-end="url(#gate-arrow)"/>
    <path d="M248 426H264" marker-end="url(#gate-arrow)"/>
    <path d="M472 426H488" marker-end="url(#gate-arrow)"/>
    <path d="M368 200V216" marker-end="url(#gate-arrow)"/>
    <path d="M368 340V356" marker-end="url(#gate-arrow)"/>
  </g>

  <g>
    <rect x="24" y="76" width="688" height="124" rx="8" fill="none" stroke="#dcdcd7" stroke-width="1.25"/>
    <text x="40" y="97" font-size="13" font-weight="600" fill="#111">While the request is open</text>

    <rect x="40" y="108" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="56" y="132" font-size="13" font-weight="600" fill="#111">Guard</text>
    <text x="56" y="148" fill="#111">Diffs the change.</text>
    <text x="56" y="164" fill="#111">Decides if tests are owed.</text>

    <rect x="264" y="108" width="208" height="76" rx="8" fill="#2f6fb0" fill-opacity="0.12" stroke="#2f6fb0" stroke-width="2"/>
    <text x="280" y="132" font-size="13" font-weight="600" fill="#111">Agent</text>
    <text x="280" y="148" fill="#111">Reads diff, story, source.</text>
    <text x="280" y="164" fill="#111">Commits to the branch.</text>

    <rect x="488" y="108" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="504" y="132" font-size="13" font-weight="600" fill="#111">Required check</text>
    <text x="504" y="148" fill="#111">Red until a commit lands.</text>
    <text x="504" y="164" fill="#111">A human then reviews.</text>
  </g>

  <g>
    <rect x="24" y="216" width="688" height="124" rx="8" fill="none" stroke="#dcdcd7" stroke-width="1.25"/>
    <text x="40" y="237" font-size="13" font-weight="600" fill="#111">On merge</text>

    <rect x="40" y="248" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="56" y="272" font-size="13" font-weight="600" fill="#111">Publish collection</text>
    <text x="56" y="288" fill="#111">Create and update only.</text>
    <text x="56" y="304" fill="#111">Never deletes.</text>

    <rect x="264" y="248" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="280" y="272" font-size="13" font-weight="600" fill="#111">Coverage workbook</text>
    <text x="280" y="288" fill="#111">A row per scenario, and</text>
    <text x="280" y="304" fill="#111">what still needs a person.</text>

    <rect x="488" y="248" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="504" y="272" font-size="13" font-weight="600" fill="#111">Attach to the story</text>
    <text x="504" y="288" fill="#111">Replaces the old copy.</text>
    <text x="504" y="304" fill="#111">Links the build.</text>
  </g>

  <g>
    <rect x="24" y="356" width="688" height="124" rx="8" fill="none" stroke="#dcdcd7" stroke-width="1.25"/>
    <text x="40" y="377" font-size="13" font-weight="600" fill="#111">On deploy</text>

    <rect x="40" y="388" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="56" y="412" font-size="13" font-weight="600" fill="#111">Run against the API</text>
    <text x="56" y="428" fill="#111">At every environment</text>
    <text x="56" y="444" fill="#111">promotion.</text>

    <rect x="264" y="388" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="280" y="412" font-size="13" font-weight="600" fill="#111">Release gate</text>
    <text x="280" y="428" fill="#111">A failure blocks the</text>
    <text x="280" y="444" fill="#111">promotion.</text>

    <rect x="488" y="388" width="208" height="76" rx="8" fill="none" stroke="#8c8c86" stroke-width="1.25"/>
    <text x="504" y="412" font-size="13" font-weight="600" fill="#111">Regression shows</text>
    <text x="504" y="428" fill="#111">As a red stage, not a</text>
    <text x="504" y="444" fill="#111">ticket weeks later.</text>
  </g>
</svg>
